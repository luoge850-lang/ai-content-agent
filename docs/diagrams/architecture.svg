<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Content Agent application architecture</title>
  <desc id="desc">A product architecture showing a Next.js client, FastAPI API, domain services, knowledge-context injection, DeepSeek generation, content lifecycle storage, and Docker backend infrastructure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 28px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .lane{font:700 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.7px;fill:#334155}
      .node-title{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .node-body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .chip{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px}
      .edge{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1500" height="760" rx="24" fill="#ffffff"/>
  <rect x="24" y="24" width="1452" height="712" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="70" class="title">AI Content Agent · product architecture</text>
  <text x="58" y="98" class="subtitle">A content workflow product with an explicit knowledge-context path and Docker-ready backend services.</text>

  <rect x="50" y="126" width="1400" height="278" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="78" y="158" class="lane">REQUEST PATH · CLIENT TO GENERATED CONTENT</text>

  <rect x="78" y="204" width="180" height="112" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="98" y="238" class="node-title">Browser</text>
  <text x="98" y="262" class="node-body">Project + content UI</text>
  <text x="98" y="284" class="node-body">JWT client session</text>
  <rect x="98" y="292" width="87" height="18" rx="9" fill="#ede9fe"/><text x="109" y="305" class="chip" fill="#6d28d9">USER</text>

  <path d="M258 260 H298" class="edge"/>
  <rect x="298" y="204" width="200" height="112" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="318" y="238" class="node-title">Next.js 14 web</text>
  <text x="318" y="262" class="node-body">App Router + TypeScript</text>
  <text x="318" y="284" class="node-body">Polls generation status</text>
  <rect x="318" y="292" width="82" height="18" rx="9" fill="#ede9fe"/><text x="329" y="305" class="chip" fill="#6d28d9">FRONTEND</text>

  <path d="M498 260 H538" class="edge"/>
  <rect x="538" y="204" width="200" height="112" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="558" y="238" class="node-title">FastAPI API</text>
  <text x="558" y="262" class="node-body">Auth + project routes</text>
  <text x="558" y="284" class="node-body">/generate and /contents</text>
  <rect x="558" y="292" width="68" height="18" rx="9" fill="#ede9fe"/><text x="569" y="305" class="chip" fill="#6d28d9">API</text>

  <path d="M738 260 H778" class="edge"/>
  <rect x="778" y="184" width="250" height="152" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="218" class="node-title">Generation workflow</text>
  <text x="800" y="242" class="node-body">Validate credits + project</text>
  <text x="800" y="264" class="node-body">Build platform / tone prompt</text>
  <text x="800" y="286" class="node-body">Create processing record</text>
  <text x="800" y="308" class="node-body">Parse JSON + fallback</text>
  <rect x="800" y="314" width="132" height="18" rx="9" fill="#ede9fe"/><text x="811" y="327" class="chip" fill="#6d28d9">APPLICATION LOGIC</text>

  <path d="M1028 260 H1068" class="edge"/>
  <rect x="1068" y="204" width="220" height="112" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088" y="238" class="node-title">DeepSeek API</text>
  <text x="1088" y="262" class="node-body">OpenAI-compatible endpoint</text>
  <text x="1088" y="284" class="node-body">Prompted generation</text>
  <rect x="1088" y="292" width="85" height="18" rx="9" fill="#ede9fe"/><text x="1099" y="305" class="chip" fill="#6d28d9">EXTERNAL LLM</text>

  <path d="M1288 260 H1328" class="edge"/>
  <rect x="1328" y="204" width="102" height="112" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1348" y="238" class="node-title">Content</text>
  <text x="1348" y="262" class="node-body">Draft →</text>
  <text x="1348" y="284" class="node-body">review →</text>
  <text x="1348" y="306" class="node-body">published</text>

  <rect x="50" y="432" width="1400" height="236" rx="18" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="78" y="464" class="lane">PERSISTENCE &amp; ASYNC INFRASTRUCTURE · DOCKER-READY</text>

  <rect x="108" y="508" width="250" height="96" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="542" class="node-title">Knowledge context</text>
  <text x="130" y="566" class="node-body">User-maintained entries</text>
  <text x="130" y="588" class="node-body">Injected into the prompt</text>
  <rect x="130" y="572" width="0" height="0"/>

  <path d="M358 556 H410" class="edge dashed"/>
  <rect x="410" y="508" width="250" height="96" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="432" y="542" class="node-title">SQLite / PostgreSQL</text>
  <text x="432" y="566" class="node-body">SQLAlchemy async sessions</text>
  <text x="432" y="588" class="node-body">Users, projects, contents</text>

  <path d="M660 556 H712" class="edge dashed"/>
  <rect x="712" y="508" width="250" height="96" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="734" y="542" class="node-title">Celery + Redis</text>
  <text x="734" y="566" class="node-body">Async email / AI / file queues</text>
  <text x="734" y="588" class="node-body">Broker + cache</text>

  <path d="M962 556 H1014" class="edge dashed"/>
  <rect x="1014" y="508" width="250" height="96" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036" y="542" class="node-title">Nginx + API workers</text>
  <text x="1036" y="566" class="node-body">Reverse proxy + rate limits</text>
  <text x="1036" y="588" class="node-body">Gunicorn / Uvicorn</text>

  <rect x="1304" y="520" width="106" height="70" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="1325" y="548" class="node-title">Scope</text>
  <text x="1325" y="570" class="node-body">MVP</text>

  <path d="M903 336 C903 420 230 420 230 508" class="edge dashed"/>
  <path d="M903 336 C903 420 535 420 535 508" class="edge dashed"/>
  <rect x="1080" y="438" width="300" height="26" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1100" y="456" class="chip" fill="#c2410c">NO EMBEDDING RETRIEVAL IN CURRENT SCOPE</text>
</svg>
